name: Deploy Kaipai

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaipai-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'byKairo/kaipai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test and build
        run: npm run cf:ci
      - name: Check public assets for credential material
        run: node scripts/deployment-safety.cjs --artifacts
      - name: Verify privacy with test-only credentials
        run: node scripts/verify-security-http.cjs --cloudflare
      - name: Deploy to Cloudflare
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKER_ONLY }}
          CLOUDFLARE_ACCOUNT_ID: e88e7ed4e217c2f22dc3bd17fde8ee1d
      - name: Verify deployed source commit
        run: node scripts/verify-deployed-release.cjs
