<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:36px 28px 38px;background-color:#f7f7f4;background-image:url(assets/cotton-paper.png);background-repeat:repeat;background-size:420px 420px;color:#333c3d;word-break:break-word"><p style="font-size:11px;line-height:21px;margin:0 0 20px;color:#8b8980;letter-spacing:2px;margin-bottom:35px">慢读笔记 / NOTES 01</p><p style="font-size:32px;line-height:58px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#343e42;font-weight:600;letter-spacing:1px;margin-bottom:22px">别急着<br>把判断交出去</p><p style="font-size:15px;line-height:27px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#67777c;margin-bottom:32px">当工具越来越快，人的价值不是继续加速，而是知道何时停下来。</p><section style="font-size:16px;line-height:29px;border-top:1px solid #c7cdc8;padding-top:25px"><p style="font-size:11px;line-height:21px;margin:0 0 20px;color:#8b8980;color:#788f96;letter-spacing:1px;margin-bottom:9px">01 / 从问题开始</p><p style="font-size:20px;line-height:36px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;font-weight:600;margin-bottom:14px">先问清楚，再让它动手</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;font-family:Songti SC,SimSun,serif">“帮我做好一点”很难得到可靠的结果。说清楚要解决什么、给谁看、怎样才算完成，工具才能真正帮上忙。</p></section><section style="font-size:16px;line-height:29px;border-top:1px solid #aab8bc;border-bottom:1px solid #aab8bc;padding:24px 0;margin:32px 0"><p style="font-size:22px;line-height:40px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#5b747d;margin:0;text-align:center">好的工具让人更自由，<br>也更清楚自己在选择什么。</p></section><p style="font-size:11px;line-height:21px;margin:0 0 20px;color:#8b8980;color:#788f96;letter-spacing:1px;margin-bottom:9px">02 / 把结果拿回来</p><p style="font-size:20px;line-height:36px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;font-weight:600;margin-bottom:14px">省下力气，不省掉判断</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;font-family:Songti SC,SimSun,serif">检查一张表、读完一段文字、验证一次输出。把重复劳动交出去，把最后的决定留在自己手里。</p><p style="font-size:11px;line-height:21px;margin:0 0 20px;color:#8b8980;text-align:center;margin:35px 0 0">— 写给每天与信息相处的人 —</p></section>
