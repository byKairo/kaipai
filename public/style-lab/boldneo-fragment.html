rotate(1deg)"><p style="font-size:24px;line-height:44px;margin:0 0 20px;margin:0;font-weight:800;color:#202020">别把准备，<br>当成已经开始。</p></section><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;color:#202020">02 / 让反馈说话</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">把它交给一个真正需要的人。看他在哪里停住，听他问什么，再决定下一步。</p><table style="font-size:14px;line-height:26px;box-sizing:border-box;width:100%;table-layout:fixed;border-collapse:collapse;border:3px solid #202020;box-shadow:4px 4px 0 #202020;margin:22px 0"><tbody><tr><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#202020;background-color:#b1d5ee;border-bottom:3px solid #202020">今天先做</th><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#202020;background-color:#b1d5ee;border-bottom:3px solid #202020">留下什么</th></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:#f0f4f5;border-bottom:3px solid #202020">一张草图</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:#f0f4f5;border-bottom:3px solid #202020">一个明确的想法</td></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:3px solid #202020">一次试用</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:3px solid #202020">一句真实的反馈</td></tr></tbody></table><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;border-top:3px solid #202020;padding-top:17px;color:#202020">本次实验 / 做一件小事，留下一个结果。</p></section>
