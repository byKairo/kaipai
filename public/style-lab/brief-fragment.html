<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 25px 36px;background-color:#ffffff;color:#303a3d;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;letter-spacing:2px;color:#526878">DECISION NOTE / 决策备忘</p><p style="font-size:33px;line-height:60px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;color:#233e51">先把决定<br>说清楚。</p><section style="font-size:16px;line-height:29px;background-color:#edf3f5;border-top:3px solid #315267;padding:20px 17px"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#56758a;font-weight:650;margin-bottom:8px">本页结论</p><p style="font-size:20px;line-height:36px;margin:0 0 20px;margin:0;font-weight:650">先解决一个影响最大的环节，<br>用可检查的结果决定下一步。</p></section><p style="font-size:19px;line-height:35px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;color:#315267">01　为什么现在做</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">计划如果只列动作，很容易变成任务堆积。说明当前的问题、希望改变的结果，以及不做会影响什么，才方便讨论优先级。</p><p style="font-size:19px;line-height:35px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;color:#315267">02　有哪些取舍</p><table style="font-size:14px;line-height:26px;box-sizing:border-box;width:100%;table-layout:fixed;border-collapse:collapse;margin:22px 0"><tbody><tr><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#315267;background-color:#eaf0f1;border-bottom:1px solid #d4dcd9">本轮保留</th><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#315267;background-color:#eaf0f1;border-bottom:1px solid #d4dcd9">本轮暂缓</th></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:#f0f4f5;border-bottom:1px solid #d4dcd9">关键流程</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:#f0f4f5;border-bottom:1px solid #d4dcd9">更多装饰</td></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">结果验证</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">功能堆叠</td></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:#f0f4f5;border-bottom:1px solid #d4dcd9">明确责任</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:#f0f4f5;border-bottom:1px solid #d4dcd9">模糊承诺</td></tr></tbody></table><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680">示例取舍表 / 应随具体项目调整</p><p style="font-size:19px;line-height:35px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;color:#315267">03　怎样知道已经完成</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">交付物是什么？由谁检查？需要什么证据？把这三个问题写在行动之前，执行时就不必反复猜测。</p><section style="font-size:16px;line-height:29px;border-top:1px solid #bfcdd5;padding-top:16px;margin-top:24px"><p style="font-size:14px;line-height:26px;margin:0 0 20px;font-weight:650;margin-bottom:10px;color:#315267">行动清单</p><p style="font-size:15px;line-height:27px;margin:0 0 20px;margin:0">□ 写清楚一个问题<br>□ 确定一个可检查的结果<br>□ 留下验证记录</p></section></section>
