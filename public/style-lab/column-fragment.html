<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 25px 36px;background-color:#ffffff;color:#303a3d;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 20px;display:inline-block;background-color:#d76f4a;color:white;padding:4px 10px;margin-bottom:20px">立场笔记</p><p style="font-size:39px;line-height:71px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;color:#232721;font-weight:800">快，<br>不总是进展。</p><p style="font-size:18px;line-height:33px;margin:0 0 20px;font-weight:650;border-bottom:1px solid #d8ddd4;padding-bottom:22px">把更多事情塞进一天，并不自动意味着把重要的事情推进了一步。</p><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-weight:650;margin:30px 0 16px">先问它在推进什么</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">一个新工具能节省时间，也能让人做更多不必做的事。如果目标仍然模糊，速度只会把模糊放大。</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">不妨把今天最忙的事情写下来：它改变了什么？结果能被谁看见？如果答不上来，先停一下，未必是浪费。</p><p style="font-size:27px;line-height:49px;margin:0 0 20px;font-weight:750;color:#b65f42;margin:34px 0">忙碌有声音。<br>进展需要证据。</p><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-weight:650;margin:30px 0 16px">给结果留一次检查</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">完成一次输出之后，别急着打开下一项任务。检查结果是否解决了原来的问题，再决定下一步。</p><section style="font-size:16px;line-height:29px;border-top:2px solid #526c4f;border-bottom:1px solid #c9d5c5;padding:16px 0;margin:28px 0"><p style="font-size:13px;line-height:24px;margin:0 0 20px;margin-bottom:8px;font-weight:650;color:#426343">一个可用的自问</p><p style="font-size:18px;line-height:33px;margin:0 0 20px;margin:0">如果今天只能保留一项成果，<br>我会保留哪一项？</p></section><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;margin-top:25px">观点专栏 / 留下一点自己的判断</p></section>
