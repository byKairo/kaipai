<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 25px 36px;background-color:#f7f7f4;background-image:url(assets/cotton-paper.png);background-size:420px 420px;background-repeat:repeat;color:#303a3d;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;letter-spacing:2px;margin-bottom:32px">慢读笔记 / NOTES 01</p><p style="font-size:32px;line-height:58px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;font-family:Songti SC,SimSun,serif;color:#343e42">别急着<br>把判断交出去</p><p style="font-size:15px;line-height:27px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#6e8187">当工具越来越快，人的价值不是继续加速，而是知道何时停下来。</p><section style="font-size:16px;line-height:29px;box-sizing:border-box;width:94%;margin:30px auto 34px;padding:11px 11px 18px;background-color:#fffef9;border:1px solid #e0ded5;box-shadow:0 4px 11px rgba(55,50,35,0.10)"><img src="assets/reading-table.png" data-w="1536" alt="把目光从屏幕移到窗边。" style="display:block;width:100%;height:auto;max-width:100%;"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;margin:14px 0 10px;color:#78786f;text-align:center">把目光从屏幕移到窗边。</p></section><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#7b9399;letter-spacing:1px">01 / 从问题开始</p><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;font-family:Songti SC,SimSun,serif;margin-top:0">先问清楚，再让它动手</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;font-family:Songti SC,SimSun,serif">“帮我做好一点”很难得到可靠的结果。说清楚要解决什么、给谁看、怎样才算完成，工具才能真正帮上忙。</p><section style="font-size:16px;line-height:29px;border-top:1px solid #aebdc0;border-bottom:1px solid #aebdc0;padding:23px 0;margin:30px 0"><p style="font-size:22px;line-height:40px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#5f7b84;text-align:center;margin:0">好的工具让人更自由，<br>也更清楚自己在选择什么。</p></section><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#7b9399;letter-spacing:1px">02 / 把结果拿回来</p><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;font-family:Songti SC,SimSun,serif;margin-top:0">省下力气，不省掉判断</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;font-family:Songti SC,SimSun,serif">检查一张表、读完一段文字、验证一次输出。把重复劳动交出去，把最后的决定留在自己手里。</p><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;text-align:center;margin:33px 0 0">— 写给每天与信息相处的人 —</p></section>
