<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 25px 36px;background-color:#fff8ef;color:#4a3029;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;text-align:center;letter-spacing:3px;margin-top:10px;color:#af873d">·　读 书　·</p><p style="font-size:38px;line-height:69px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;font-family:Songti SC,SimSun,serif;text-align:center;color:#4a3029;font-weight:600;border-top:3px double #ba9149;border-bottom:3px double #ba9149;padding:18px 0">页边的<br>空白。</p><p style="font-size:19px;line-height:35px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;text-align:center;color:#967c65;margin:32px 0">读到一句话，<br>不急着读下一句。</p><p style="font-size:19px;line-height:35px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;font-family:Songti SC,SimSun,serif;color:#b84938;text-align:center">一 / 给判断留一点时间</p><section style="font-size:16px;line-height:29px;margin:25px 0 30px"><img src="assets/reading-table.png" data-w="1536" alt="一页书之外，还有窗边的光。" style="display:block;width:100%;height:auto;max-width:100%;"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;margin:12px 0 0;color:#686d65">一页书之外，还有窗边的光。</p></section><p style="font-size:16px;line-height:29px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#4a3029">一本书的页边，总给人留下一点余地。可以写下一句疑问，也可以什么都不写，只让目光在那里停一会儿。</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#4a3029">那些还没说出口的判断，往往需要一点时间。它们不在目录里，也没有被画成重点，却可能在合上书之后慢慢出现。</p><p style="font-size:18px;line-height:33px;margin:0 0 20px;text-align:center;color:#ba9149;margin:29px 0">·</p><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;text-align:center;color:#4a3029;margin:28px 0;border-top:1px solid #ba9149;border-bottom:1px solid #ba9149;padding:20px 0">读书不必每一页都有所得。<br>有时，停留本身就是所得。</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;font-family:Songti SC,SimSun,serif;color:#4a3029">与其急着把每个观点变成笔记，不如先问：它与自己的生活有什么关系？书里的语言，经过这样的停留，才慢慢变成自己的语言。</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;text-align:right;margin:26px 0 0"><span style="font-size:18px;line-height:33px;font-family:Songti SC,SimSun,serif;display:inline-block;padding:3px 9px;color:#fff8ef;background-color:#b84938;border-radius:3px">读</span></p><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;text-align:center;margin:35px 0 0">一页读完，给自己留一点余地。</p></section>
