<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楷排 · 十二套原创文章风格</title></head><body style="margin:0"><section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 25px 36px;background-color:#fffdf5;color:#303a3d;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#92762e;letter-spacing:2px">FIELD GUIDE / 轻装出发</p><p style="font-size:30px;line-height:54px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;color:#4c4c38">第一次逛展，<br>先找到自己的路线。</p><section style="font-size:16px;line-height:29px;background-color:#fbefc7;padding:16px 18px;border-radius:4px"><p style="font-size:13px;line-height:24px;margin:0 0 20px;font-weight:650;margin-bottom:7px;color:#8c6b1d">出发前先回答</p><p style="font-size:18px;line-height:33px;margin:0 0 20px;margin:0">今天最想看懂什么？<br>留一个主要目标就够了。</p></section><section style="font-size:16px;line-height:29px;margin:25px 0"><img src="assets/route-sample.png" data-w="720" alt="示例路线 · 不是某个真实展馆的地图" style="display:block;width:100%;height:auto;border-radius:10px;"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;margin:12px 0 0;color:#686d65">示例路线 · 不是某个真实展馆的地图</p></section><p style="font-size:19px;line-height:35px;margin:0 0 20px;font-weight:650;margin:30px 0 16px"><span style="font-size:14px;line-height:26px;background-color:#eec65a;color:#49472d;padding:2px 7px;margin-right:8px">01</span>先看演示，再听介绍</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">找一段完整的演示。看它从接到任务到给出结果经历了什么，通常比记住几个口号更有用。</p><p style="font-size:19px;line-height:35px;margin:0 0 20px;font-weight:650;margin:30px 0 16px"><span style="font-size:14px;line-height:26px;background-color:#eec65a;color:#49472d;padding:2px 7px;margin-right:8px">02</span>把问题问得具体</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">问它在什么情况下做不到，结果需要怎样检查，使用前需要准备什么。带着问题看，才容易留下自己的判断。</p><section style="font-size:16px;line-height:29px;border:1px dashed #cbbb78;padding:15px;margin:27px 0"><p style="font-size:14px;line-height:26px;margin:0 0 20px;font-weight:650;margin-bottom:9px;color:#7e712e">随手记录</p><p style="font-size:15px;line-height:27px;margin:0 0 20px;margin:0">□ 一个值得记住的演示<br>□ 一个还没弄懂的问题<br>□ 一个准备回去尝试的想法</p></section><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;text-align:center;margin:27px 0 0">路线留一点余量，给意外的发现。</p></section></body></html>
