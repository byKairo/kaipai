<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楷排 · 十二套原创文章风格</title></head><body style="margin:0"><section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 25px 36px;background-color:#f7f3e9;color:#303a3d;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#2c51b1;letter-spacing:2px">IDEA DESK / 灵感便签</p><p style="font-size:41px;line-height:74px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;color:#26458d;font-weight:800">灵感<br>不排队。</p><section style="font-size:16px;line-height:29px;background-color:#3157b0;display:inline-block;padding:11px 14px;transform:rotate(-2deg);margin:3px 6px 24px"><p style="font-size:20px;line-height:36px;margin:0 0 20px;color:white;font-weight:700;margin:0">先试一个小想法</p></section><p style="font-size:17px;line-height:31px;margin:0 0 20px;color:#424d5b">别等整个计划都准备好。先选一个小问题，画一张草图，让想法碰一碰现实。</p><section style="font-size:16px;line-height:29px;box-sizing:border-box;margin:30px 4px;padding:13px;background-color:#292b2c;transform:rotate(-1.5deg);transform-origin:center"><p style="font-size:11px;line-height:21px;margin:0 0 20px;color:#d4d6cb;letter-spacing:2px;margin:0 0 11px">FRAME 01 · CONTACT SHEET</p><img src="assets/reading-table.png" data-w="1536" alt="一张桌子，也可以是想法的起点。" style="display:block;width:100%;height:auto;max-width:100%;"><p style="font-size:13px;line-height:24px;margin:0 0 20px;color:#edece5;margin:13px 0 0">一张桌子，也可以是想法的起点。</p></section><p style="font-size:35px;line-height:63px;margin:0 0 20px;color:#cd8270;font-weight:700;margin:25px 0 0">01</p><p style="font-size:20px;line-height:36px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;color:#26458d;margin-top:0">不必一开始就像个成品</p><p style="font-size:16px;line-height:29px;margin:0 0 20px;color:#4b5360">记下你看见的细节。试一次，再改一次。下一步往往是在动手之后才出现的。</p><section style="font-size:16px;line-height:29px;padding:17px;background-color:#ecd8ca;border:1px solid #ccb5a1;transform:rotate(1.5deg);margin:30px 7px"><p style="font-size:22px;line-height:40px;margin:0 0 20px;margin:0;font-weight:650;color:#503e35">先让想法发生，<br>再让它变得更好。</p></section><table style="font-size:14px;line-height:26px;box-sizing:border-box;width:100%;table-layout:fixed;border-collapse:collapse;margin:22px 0;border-top:2px solid #48565b;border-bottom:2px solid #48565b"><tbody><tr><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#26458d;background-color:transparent;border-bottom:1px solid #d4dcd9">观察</th><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#26458d;background-color:transparent;border-bottom:1px solid #d4dcd9">记录</th><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#26458d;background-color:transparent;border-bottom:1px solid #d4dcd9">试一次</th></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">看见细节</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">留下草图</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">接触现实</td></tr></tbody></table><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;margin:27px 0 0">少一点等待，多一点发生。</p></section></body></html>
