<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:0;background-color:#f6f9f8;color:#303a3d;word-break:break-word;text-align:left"><section style="font-size:16px;line-height:29px;background-color:#17363b;padding:26px"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#91b8bc;letter-spacing:2px">LAB NOTES / 过程记录</p><p style="font-size:33px;line-height:60px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;color:#e6f0ec;margin:0">把变化<br>记下来。</p></section><section style="font-size:16px;line-height:29px;padding:25px"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;font-family:Menlo,Consolas,monospace;color:#627f82;margin:0 0 25px">观察 → 假设 → 验证</p><p style="font-size:20px;line-height:36px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;margin-top:0"><span style="font-size:12px;line-height:22px;font-family:Menlo,Consolas,monospace;color:#648d8e;margin-right:10px">LOG 01</span>先描述现象</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">不要一开始就给问题定性。记录什么时候发生、出现了什么、怎样重复，才方便判断下一步该查哪里。</p><section style="font-size:16px;line-height:29px;background-color:#17363b;border-left:3px solid #77b5ad;padding:16px;margin:24px 0"><p style="font-size:12px;line-height:22px;margin:0 0 20px;font-family:Menlo,Consolas,monospace;color:#95c7c4;margin-bottom:7px">观察记录</p><p style="font-size:14px;line-height:26px;margin:0 0 20px;font-family:Menlo,Consolas,monospace;color:#d4e5df;margin:0">现象：切换文章后，显示了旧内容。<br>检查：保存当前状态，再重现切换步骤。</p></section><p style="font-size:20px;line-height:36px;margin:0 0 20px;font-weight:650;margin:30px 0 16px"><span style="font-size:12px;line-height:22px;font-family:Menlo,Consolas,monospace;color:#648d8e;margin-right:10px">LOG 02</span>让假设可以被推翻</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">写下预期结果，再改变一个条件。如果结果与预期不一致，修改判断，而不是继续围着原来的解释打补丁。</p><table style="font-size:14px;line-height:26px;box-sizing:border-box;width:100%;table-layout:fixed;border-collapse:collapse;margin:22px 0;border-top:2px solid #48565b;border-bottom:2px solid #48565b"><tbody><tr><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#486f73;background-color:transparent;border-bottom:1px solid #d4dcd9">留下什么</th><th style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:650;color:#486f73;background-color:transparent;border-bottom:1px solid #d4dcd9">为什么</th></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">重现步骤</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">别人可以复查</td></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">预期与实际</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">能判断变化</td></tr><tr><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">验证记录</td><td style="font-size:14px;line-height:26px;padding:11px 9px;text-align:left;vertical-align:top;font-weight:400;color:#3e4549;background-color:transparent;border-bottom:1px solid #d4dcd9">避免重复猜测</td></tr></tbody></table><p style="font-size:23px;line-height:42px;margin:0 0 20px;font-weight:650;color:#426c69;margin:29px 0">修好一次问题，<br>也留下一次理解。</p><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;margin-top:25px">上述故障记录为排版示例，非当前产品状态。</p></section></section>
