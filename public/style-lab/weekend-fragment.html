<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 25px 36px;background-color:#fff8f3;color:#303a3d;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#a57466;letter-spacing:2px">OFF DUTY / 周末小事</p><p style="font-size:38px;line-height:69px;margin:0 0 20px;font-weight:700;margin:12px 0 26px;color:#b96151;font-weight:750">周末，<br>不必排满。</p><p style="font-size:19px;line-height:35px;margin:0 0 20px;color:#8c6c62">计划少一点，<br>才看得见临时喜欢的东西。</p><section style="font-size:16px;line-height:29px;box-sizing:border-box;width:94%;margin:30px auto 34px;padding:11px 11px 18px;background-color:#fffef9;border:1px solid #e0ded5;box-shadow:0 4px 11px rgba(55,50,35,0.10);transform:rotate(-1.5deg);transform-origin:center"><img src="assets/bookstore-street.png" data-w="1536" alt="留一段路，只用来走一走。" style="display:block;width:100%;height:auto;max-width:100%;"><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;margin:14px 0 10px;color:#78786f;text-align:center">留一段路，只用来走一走。</p></section><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;color:#a95a4d">先给自己一小时</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">不用急着找到最好玩的地方。沿着一条熟悉的路走走，看看平时匆匆经过的窗、树和小店。</p><section style="font-size:16px;line-height:29px;background-color:#f1e0d6;border-radius:16px 3px 16px 3px;padding:18px;margin:27px 0"><p style="font-size:21px;line-height:38px;margin:0 0 20px;color:#9e6659;margin:0;font-weight:650">不打卡，也算出门。</p></section><p style="font-size:21px;line-height:38px;margin:0 0 20px;font-weight:650;margin:30px 0 16px;color:#a95a4d">只带回一个喜欢的细节</p><p style="font-size:16px;line-height:29px;margin:0 0 20px">一束光、一种声音，或者一本没见过的书。给它拍张照片，留一句说明，比塞满相册更容易记住。</p><p style="font-size:12px;line-height:22px;margin:0 0 20px;color:#828680;color:#a57466;margin-top:25px">本周可以试试</p><p style="font-size:15px;line-height:27px;margin:0 0 20px;margin-bottom:0">○ 走一条不同的路<br>○ 在窗边读一页书<br>○ 把一张照片印出来</p></section>
