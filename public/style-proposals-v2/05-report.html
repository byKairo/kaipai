<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 24px 32px;background-color:#fffefb;color:#30322f;word-break:break-word;text-align:left"><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;text-align:center">研究笔记 / 使用观察</p><p style="font-size:24px;line-height:44px;margin:0 0 18px;font-weight:700;margin:12px 0 24px;text-align:center">AI 工具，真的能替你干活吗？</p><section style="font-size:16px;line-height:29px;padding:14px 16px;border-top:1px solid #bcb5a7;border-bottom:1px solid #bcb5a7"><p style="font-size:13px;line-height:24px;margin:0 0 18px;color:#74654e;font-weight:600;margin-bottom:8px">摘要</p><p style="font-size:15px;line-height:27px;margin:0 0 18px;margin:0">用了三个月，我越来越确定：真正有用的，不是把任务一次性交出去，而是找到一个能反复验证的小环节。</p></section><p style="font-size:19px;line-height:35px;margin:0 0 18px;font-weight:600;margin:30px 0 18px">1　先从小事开始</p><p style="font-size:16px;line-height:29px;margin:0 0 18px">先从整理表格、梳理资料开始。把结果拿回来检查，再决定下一步交给它什么。</p><p style="font-size:18px;line-height:33px;margin:0 0 18px;margin:28px 0;color:#74654e;font-size:15px;line-height:27px">工具不会替你思考，它只会放大你已有的习惯。</p><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;text-align:right">—— 引自作者使用笔记</p><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;text-align:center;margin-top:28px;margin-bottom:0">表 1　不同任务的适用性</p><table style="font-size:14px;line-height:26px;width:100%;border-collapse:collapse;table-layout:fixed;margin:22px 0 12px"><tbody><tr><th style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:600;border-bottom:1px solid #d5d0c6;border-top:2px solid #383832;">场景</th><th style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:600;border-bottom:1px solid #d5d0c6;border-top:2px solid #383832;">能用吗</th></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #d5d0c6;">整理表格</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #d5d0c6;">可用</td></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #d5d0c6;">写周报</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #d5d0c6;">需修改</td></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #d5d0c6;border-bottom:2px solid #383832;">算工程量</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #d5d0c6;border-bottom:2px solid #383832;">不可靠</td></tr></tbody></table><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78">说明：此处为排版示例中的个人观察，并非通用能力评测。</p></section>
