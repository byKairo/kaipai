<section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 24px 32px;background-color:#f6f3eb;color:#30322f;word-break:break-word;text-align:left"><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;letter-spacing:2px">ISSUE 01 / 工作与生活</p><p style="font-size:30px;line-height:54px;margin:0 0 18px;font-weight:700;margin:12px 0 24px;letter-spacing:1px;margin-top:26px;margin-bottom:28px">AI 工具，真的能替你干活吗？</p><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;border-bottom:1px solid #bcb7ad;padding-bottom:22px">三个月的使用笔记</p><p style="font-size:16px;line-height:29px;margin:0 0 18px;margin-top:28px">用了三个月，我越来越确定：真正有用的，不是把任务一次性交出去，而是找到一个能反复验证的小环节。</p><p style="font-size:20px;line-height:36px;margin:0 0 18px;font-weight:600;margin:30px 0 18px"><span style="font-size:13px;line-height:24px;color:#5a5247;margin-right:10px">01</span>先从小事开始</p><p style="font-size:16px;line-height:29px;margin:0 0 18px">先从整理表格、梳理资料开始。把结果拿回来检查，再决定下一步交给它什么。</p><p style="font-size:18px;line-height:33px;margin:0 0 18px;margin:28px 0;color:#5a5247;border-top:1px solid #8b8477;border-bottom:1px solid #8b8477;padding:20px 0;color:#393830;font-size:21px;line-height:38px">工具不会替你思考，它只会放大你已有的习惯。</p><table style="font-size:14px;line-height:26px;width:100%;border-collapse:collapse;table-layout:fixed;margin:22px 0 12px"><tbody><tr><th style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:600;border-bottom:1px solid #d5d0c6;border-top:2px solid #383832;">场景</th><th style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:600;border-bottom:1px solid #d5d0c6;border-top:2px solid #383832;">能用吗</th></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #d5d0c6;">整理表格</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #d5d0c6;">可用</td></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #d5d0c6;">写周报</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #d5d0c6;">需修改</td></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #d5d0c6;border-bottom:2px solid #383832;">算工程量</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #d5d0c6;border-bottom:2px solid #383832;">不可靠</td></tr></tbody></table></section>
