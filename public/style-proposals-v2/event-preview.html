<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>楷排 · 12 套真实 HTML 排版</title></head><body style="margin:0"><section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;padding:30px 24px 32px;background-color:#ffffff;color:#30322f;word-break:break-word;text-align:left"><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;color:#69603d;text-align:center">主题分享 / 使用 AI 的第一步</p><p style="font-size:28px;line-height:51px;margin:0 0 18px;font-weight:700;margin:12px 0 24px;text-align:center;border-top:1px solid #ccc7b7;border-bottom:1px solid #ccc7b7;padding:18px 0">AI 工具，真的能替你干活吗？</p><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;color:#69603d;margin-top:28px;margin-bottom:4px">议题 01</p><p style="font-size:20px;line-height:36px;margin:0 0 18px;font-weight:600;margin:30px 0 18px;margin-top:0">先从小事开始</p><p style="font-size:16px;line-height:29px;margin:0 0 18px">用了三个月，我越来越确定：真正有用的，不是把任务一次性交出去，而是找到一个能反复验证的小环节。</p><p style="font-size:11px;line-height:21px;margin:0 0 18px;color:#827e78;color:#69603d;margin-top:28px;margin-bottom:4px">议题 02</p><p style="font-size:20px;line-height:36px;margin:0 0 18px;font-weight:600;margin:30px 0 18px;margin-top:0">什么值得交给工具？</p><p style="font-size:16px;line-height:29px;margin:0 0 18px">先从整理表格、梳理资料开始。把结果拿回来检查，再决定下一步交给它什么。</p><table style="font-size:14px;line-height:26px;width:100%;border-collapse:collapse;table-layout:fixed;margin:22px 0 12px"><tbody><tr><th style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:600;border-bottom:1px solid #dce0e1;color:#69603d;background-color:#f3f4f2;">场景</th><th style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:600;border-bottom:1px solid #dce0e1;color:#69603d;background-color:#f3f4f2;">能用吗</th></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #dce0e1;">整理表格</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #dce0e1;">可用</td></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #dce0e1;">写周报</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #dce0e1;">需修改</td></tr><tr><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #dce0e1;">算工程量</td><td style="font-size:14px;line-height:26px;padding:10px 8px;text-align:right;font-weight:400;border-bottom:1px solid #dce0e1;">不可靠</td></tr></tbody></table><p style="font-size:18px;line-height:33px;margin:0 0 18px;margin:28px 0;color:#69603d;padding:16px;border:1px dashed #c4bead;font-size:16px;line-height:29px">工具不会替你思考，它只会放大你已有的习惯。</p></section></body></html>
