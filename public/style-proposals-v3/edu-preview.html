<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楷排 · 案例吸收后的 12 套文章排版</title></head><body style="margin:0"><section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;background-color:#f7faff;color:#272723;padding:28px 24px 32px;word-break:break-word;text-align:left"><p style="font-size:26px;line-height:47px;margin:0 0 18px;font-weight:700;margin:12px 0 26px">AI 工具，<br>真的能替你干活吗？</p><section style="font-size:16px;line-height:29px;background-color:#e5edff;padding:14px 15px;border-radius:12px"><p style="font-size:12px;line-height:22px;margin:0 0 18px;color:#8c887f;color:#3b6fd5;font-weight:700;letter-spacing:1px;margin-bottom:4px">ANSWER · 先说答案</p><p style="font-size:17px;line-height:31px;margin:0 0 18px;margin:0">能，但要从小事开始，别一上来就交给它整个项目。</p></section><p style="font-size:19px;line-height:35px;margin:0 0 18px;margin:26px 0 18px;font-weight:650"><span style="font-size:13px;line-height:24px;background-color:#3b6fd5;color:white;border-radius:15px;padding:2px 9px;margin-right:7px">STEP 01</span>先从小事开始</p><p style="font-size:16px;line-height:29px;margin:0 0 18px">我用了三个月，结论只有一句：先从小事开始，别一上来就交给它整个项目。</p><section style="font-size:16px;line-height:29px;border:2px dashed #3b6fd5;padding:12px 14px;border-radius:10px;margin:22px 0"><p style="font-size:16px;line-height:29px;margin:0 0 18px;margin:0"><span style="font-size:16px;line-height:29px;color:#3b6fd5;font-weight:700">划重点</span> 工具不会替你思考，它只会放大你已有的习惯。</p></section><table style="font-size:14px;line-height:26px;width:100%;border-collapse:collapse;table-layout:fixed;margin:22px 0 12px;border:1px solid #d4d9dd"><tbody><tr><th style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#22272e;font-weight:650;background-color:#dde8fc;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">场景</th><th style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#22272e;font-weight:650;background-color:#dde8fc;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">能用吗</th></tr><tr><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#272b2e;font-weight:400;background-color:transparent;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">整理表格</td><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#272b2e;font-weight:400;background-color:transparent;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">可用</td></tr><tr><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#272b2e;font-weight:400;background-color:transparent;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">写周报</td><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#272b2e;font-weight:400;background-color:transparent;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">需修改</td></tr><tr><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#272b2e;font-weight:400;background-color:transparent;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">算工程量</td><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#272b2e;font-weight:400;background-color:transparent;border-bottom:1px solid #d4d9dd;border-right:1px solid #d4d9dd">不可靠</td></tr></tbody></table><section style="font-size:16px;line-height:29px;background-color:#fff2cc;border-radius:8px;padding:12px 14px;margin-top:16px"><p style="font-size:14px;line-height:26px;margin:0 0 18px;margin:0"><span style="font-size:14px;line-height:26px;color:#a5771c;font-weight:650">易错提醒</span>　不要一次交出整个项目。</p></section></section></body></html>
