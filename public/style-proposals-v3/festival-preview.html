<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>楷排 · 案例吸收后的 12 套文章排版</title></head><body style="margin:0"><section style="font-size:16px;line-height:29px;box-sizing:border-box;width:100%;background-color:#fff8ef;color:#272723;padding:28px 24px 32px;word-break:break-word;text-align:left"><p style="font-size:12px;line-height:22px;margin:0 0 18px;color:#8c887f;color:#b38130;text-align:center;letter-spacing:3px;margin:8px 0 20px">·　寒　露　·</p><p style="font-size:28px;line-height:51px;margin:0 0 18px;font-weight:700;margin:12px 0 26px;font-family:Songti SC,SimSun,serif;text-align:center;color:#4d3026;border-top:3px double #b38130;border-bottom:3px double #b38130;padding:19px 0">AI 工具，<br>真的能替你干活吗？</p><p style="font-size:21px;line-height:38px;margin:0 0 18px;margin:26px 0 18px;font-weight:650;font-family:Songti SC,SimSun,serif;color:#b6402f;text-align:center">◆ 先从小事开始 ◆</p><p style="font-size:16px;line-height:29px;margin:0 0 18px;font-family:Songti SC,SimSun,serif;color:#4d3026">我用了三个月，结论只有一句：<span style="font-size:16px;line-height:29px;color:#b6402f;border-bottom:2px dotted #b6402f">先从小事开始</span>，别一上来就交给它整个项目。</p><p style="font-size:18px;line-height:33px;margin:0 0 18px;font-family:Songti SC,SimSun,serif;border-top:1px solid #b38130;border-bottom:1px solid #b38130;padding:18px 0;color:#4d3026;margin:24px 0">工具不会替你思考，它只会放大你已有的习惯。 <span style="font-size:15px;line-height:27px;background-color:#b6402f;color:white;font-weight:700;border-radius:3px;padding:2px 4px">楷</span></p><table style="font-size:14px;line-height:26px;width:100%;border-collapse:collapse;table-layout:fixed;margin:22px 0 12px;border:1px solid #bc943e;font-family:Songti SC,SimSun,serif"><tbody><tr><th style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#ffffff;font-weight:650;background-color:#b6402f;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">场景</th><th style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#ffffff;font-weight:650;background-color:#b6402f;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">能用吗</th></tr><tr><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#563b31;font-weight:400;background-color:#fff1df;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">整理表格</td><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#563b31;font-weight:400;background-color:#fff1df;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">可用</td></tr><tr><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#563b31;font-weight:400;background-color:#fff1df;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">写周报</td><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#563b31;font-weight:400;background-color:#fff1df;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">需修改</td></tr><tr><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#563b31;font-weight:400;background-color:#fff1df;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">算工程量</td><td style="font-size:14px;line-height:26px;width:50%;padding:10px 8px;text-align:left;color:#563b31;font-weight:400;background-color:#fff1df;border-bottom:1px solid #bc943e;border-right:1px solid #bc943e">不可靠</td></tr></tbody></table></section></body></html>
