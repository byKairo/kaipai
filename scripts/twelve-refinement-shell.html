<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>十二套风格 · 精修对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#efefeb;color:#242a27;font:14px/1.7 -apple-system,'PingFang SC',sans-serif}header{padding:28px 24px 20px;background:#fafbf8;border-bottom:1px solid #daddd5}header>div{max-width:1050px;margin:auto}small{font-size:11px;letter-spacing:2px;color:#6c766f}h1{font-size:26px;line-height:1.4;margin:8px 0}header p{margin:8px 0;color:#687169;max-width:760px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}button,select{font:inherit;font-size:13px;padding:8px 12px;border:1px solid #cbd2c9;border-radius:6px;background:#fff;color:#303c32;cursor:pointer}button[aria-pressed=true]{background:#334e3e;color:#fff;border-color:#334e3e}button:focus-visible,select:focus-visible{outline:3px solid #7e9d88;outline-offset:3px}.chooser{display:flex;flex-wrap:wrap;gap:8px;overflow:auto;max-width:1100px;margin:0 auto;padding:20px 24px 12px}.chooser button{white-space:nowrap}.design{max-width:1050px;margin:0 auto;padding:4px 24px 18px;color:#59655b}.design strong{color:#263a2c}.stage{display:flex;justify-content:center;align-items:flex-start;gap:24px;padding:0 20px 30px;overflow:auto}.sheet{flex:0 0 auto;width:var(--width,390px);max-width:calc(100vw - 40px)}.label{font-size:12px;color:#616c62;margin-bottom:8px;display:flex;justify-content:space-between}iframe{display:block;border:0;width:100%;height:73vh;min-height:500px;background:white;box-shadow:0 4px 24px #28372909}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;max-width:1200px;margin:auto;padding:0 24px 30px}.gallery iframe{height:630px;min-height:0;pointer-events:none}.gallery button{border:0;background:none;text-align:left;padding:0;width:100%;font-size:15px;font-weight:600}.gallery .label{padding:5px 0}footer{padding:12px 24px 30px;color:#69746c;text-align:center;font-size:12px}[hidden]{display:none!important}@media(max-width:850px){.stage.compare{justify-content:flex-start}.gallery{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}header{padding:20px}h1{font-size:22px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body><header><div><small>楷排 · 十二套风格精修 / 本地候选</small><h1>保留十二种性格，把每一套搭配完整。</h1><p>沿用你提供的十二套方向，分别调整章节、正文、引用与强调之间的关系。可切换原版对照，也可换成《离开工地这8年》检查完整长文。</p><div class="toolbar" aria-label="查看方式"><button data-view="solo" aria-pressed="true">单套精读</button><button data-view="compare" aria-pressed="false">原版 / 精修对照</button><button data-view="gallery" aria-pressed="false">12 套总览</button><select id="content" aria-label="预览内容"><option value="sample">组件样稿</option><option value="long">真实文章 · 离开工地这8年</option></select><select id="width" aria-label="文章宽度"><option value="390">390px 手机宽度</option><option value="320">320px 窄屏</option><option value="440">440px 宽屏</option></select></div><div class="toolbar"><button id="top">文章开头</button><button id="chapter">第一章</button><button id="bottom">文末 / 组件</button><button id="mono" aria-pressed="false">黑白检查</button></div></div></header><nav class="chooser" aria-label="风格选择"></nav><div class="design" id="design"></div><main><div class="stage" id="stage"><section class="sheet" id="before" hidden><div class="label">你提供的原版 <span>同一份内容</span></div><iframe title="原版样稿"></iframe></section><section class="sheet"><div class="label"><span id="chosen"></span><span>精修版</span></div><iframe id="after" title="精修样稿"></iframe></section></div><div class="gallery" id="gallery" hidden></div></main><footer>本页为网页设计验证，尚未替换网站模板或发布。公众号内联转换和实际粘贴验收将在方案确定后处理。<br>真实文章保留原文与原有加粗；组件样稿中的引语仅用于展示，不作为真实出处。</footer><script>
const D=__DATA__;let selected=0,view='solo',content='sample',width=390,mono=false;
const $=s=>document.querySelector(s);const safe=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function doc(i,improved){const s=(improved?D.refined:D.old)[i];const keys=['bg','fg','hc','ac','mu','ln','cb','hl','th','fs','lh','ls','ps','h1','h2','r','tb','ts','h1w','h1a','qs','chapter','after','opening'];const vars=keys.filter(k=>s[k]!=null).map(k=>'--'+k+':'+s[k]).join(';')+';--px:'+s.px+'px;--ff:var(--'+({s:'sans',r:'serif',m:'mono'}[s.ff])+')';let body=D.samples[i];if(improved){body=body.replace('— 某位老编辑','— 排版示例').replace(/<i>.*?<\/i>/g,(()=>{let n=0;return ()=>'<i>'+s.nf.replace('{n}',String(++n).padStart(2,'0')).replace('{c}',['一','二','三','四','五'][n-1])+'</i>'})());}
if(content==='long')body=D.long.replace(/<i data-number="(\d+)"><\/i>/g,(_,n)=>'<i>'+s.nf.replace('{n}',String(n).padStart(2,'0')).replace('{c}',['一','二','三','四','五'][n-1])+'</i>');
return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--serif:"Songti SC",SimSun,serif;--mono:"SF Mono",Menlo,Consolas,"PingFang SC",monospace}body{margin:0;filter:'+(mono?'grayscale(1)':'none')+'}'+(improved?D.polished:D.css)+'</style></head><body><article class="art" style="'+safe(vars)+'" '+['h','q','b','m','c','t'].map(k=>'data-'+k+'="'+s[k]+'"').join(' ')+'>'+body+'</article></body></html>'}
function loadFrame(f,html){f.onload=()=>{const d=f.contentDocument,a=d.querySelector('.art');const copy=a.cloneNode(true);copy.querySelectorAll('h2 i').forEach(n=>n.remove());f.dataset.validation=JSON.stringify({width:f.clientWidth,scroll:d.documentElement.scrollWidth,headings:a.querySelectorAll('h2').length,bold:a.querySelectorAll('b').length,text:copy.textContent.replace(/\s/g,'')});};f.srcdoc=html;}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));$('.chooser').innerHTML=D.old.map((s,i)=>'<button data-style="'+i+'" aria-pressed="'+(selected===i)+'">'+String(i+1).padStart(2,'0')+' '+s.n+'</button>').join('');$('#design').innerHTML=view==='gallery'?'十二套精修版总览。点击名称展开完整样稿；手机宽度可在单套或对照视图切换。':'<strong>'+D.notes[selected][0]+'。</strong> '+D.notes[selected][1];$('#width').disabled=view==='gallery';$('#chosen').textContent=D.old[selected].n;$('#stage').hidden=view==='gallery';$('#gallery').hidden=view!=='gallery';$('#before').hidden=view!=='compare';$('#stage').className='stage '+view;document.documentElement.style.setProperty('--width',width+'px');if(view==='gallery'){$('#gallery').replaceChildren();D.old.forEach((s,i)=>{const c=document.createElement('section');const b=document.createElement('button');b.dataset.style=i;b.innerHTML='<div class="label">'+String(i+1).padStart(2,'0')+' '+s.n+' ↗</div>';const f=document.createElement('iframe');f.title=s.n+'精修预览';loadFrame(f,doc(i,true));c.append(b,f);$('#gallery').append(c)})}else{loadFrame($('#after'),doc(selected,true));loadFrame($('#before iframe'),doc(selected,false))}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.style!==undefined){selected=+b.dataset.style;if(view==='gallery')view='solo';render()}else if(b.id==='mono'){mono=!mono;b.setAttribute('aria-pressed',mono);document.querySelectorAll('iframe').forEach(f=>{if(f.contentDocument?.body)f.contentDocument.body.style.filter=mono?'grayscale(1)':'none'})}else if(['top','chapter','bottom'].includes(b.id)){document.querySelectorAll('iframe').forEach(f=>{const d=f.contentDocument;if(!d)return;const target=b.id==='chapter'?d.querySelector('h2'):null;f.contentWindow.scrollTo(0,b.id==='bottom'?d.documentElement.scrollHeight:target?Math.max(0,target.offsetTop-20):0)})}});
$('#content').onchange=e=>{content=e.target.value;render()};$('#width').onchange=e=>{width=+e.target.value;render()};render();
</script></body></html>
